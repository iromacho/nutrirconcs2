<!DOCTYPE html>
<html lang="en">
	<head>
    <link rel="stylesheet" href="/css/access-gate.css">
    <script src="/js/access-gate.js" defer></script>

		<meta charset="utf-8">
		<title>The World's Hardest Game</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="shortcut icon" type="image/x-icon" href="images/icon.png"/>
		<link rel="stylesheet" type="text/css" href="style.css">
		<script src="../../js/game-score-system.js" defer></script>
		<script type="text/javascript" src="script.js"></script>
	</head>
	<body data-score-system data-game-id="the-worlds-hardest-game" data-leaderboard-limit="5" data-prompt-name="true">
		<div id="container">
			<div class="game-score-panel">
				<div class="game-score-row"><span>Jugador</span><strong data-player-name>Invitado</strong></div>
				<div class="game-score-row"><span>Puntos</span><strong data-score-current>0</strong></div>
				<div class="game-score-row"><span>Récord</span><strong data-score-high>0</strong></div>
				<div class="game-score-row"><span>Horas</span><strong data-playtime-current>0h 0m</strong></div>
			</div>
			<div class="container-header"><span id="coins"></span><span id="level"></span><span id="deaths"></span></div>
			<div id="home-screen">
				<div id="square"></div>
				<div id="title"><p>THE WORLD'S...</p><p>HARDEST GAME</p><p>VERSION 1.0</p></div>
				<p id="new-game" onclick="startGame(true)">New<br>Game</p>
				<p id="load-game" onclick="startGame(false)">Load<br>Game</p>
			</div>
			<canvas id="cvs" width="1100" height="700"></canvas>
			<div class="container-footer"><span id="sound" onclick="sound()">🔊</span><span id="time"></span><span id="full" onclick="fullScreen()">&#x26F6;</span></div>
		</div>
	</body>
</html>
